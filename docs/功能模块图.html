<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>青野 · 功能模块图</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; color: #263c32; background: #fff; font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
    main { max-width: 1320px; margin: 0 auto; padding: 28px 24px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 16px; }
    h1 { margin: 0; font-size: 23px; }
    button { padding: 9px 13px; border: 1px solid #bbc9c1; border-radius: 5px; background: #fff; color: #187553; font: inherit; font-size: 12px; cursor: pointer; }
    button:hover { background: #f0f6f2; }
    button:focus-visible { outline: 3px solid #267bb4; outline-offset: 3px; }
    figure { margin: 0; }
    .canvas { overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 940px; height: auto; }
    .lines { fill: none; stroke: #303d37; stroke-width: 1.8; }
    .root-box, .role-box, .module-box { fill: #fff; stroke: #303d37; stroke-width: 1.8; }
    text { fill: #263c32; text-anchor: middle; }
    .root-name { font-size: 25px; font-weight: 600; }
    .root-description { font-size: 17px; }
    .role-name { font-size: 22px; }
    .module-name { font-size: 21px; }
    figcaption { margin-top: 4px; color: #52665a; font-size: 12px; text-align: center; }
    .note { margin: 15px 0 0; color: #52665a; font-size: 12px; line-height: 1.8; text-align: center; }
    @media (max-width: 600px) {
      main { padding: 18px 12px; }
      h1 { font-size: 19px; }
      button { padding: 8px; font-size: 11px; }
      .note { text-align: left; }
    }
    @page { size: A4 landscape; margin: 12mm; }
    @media print {
      main { max-width: none; padding: 0; }
      header { margin-bottom: 12px; }
      h1 { font-size: 18px; }
      button { display: none; }
      .canvas { overflow: visible; }
      svg { min-width: 0; }
      figcaption, .note { font-size: 10px; }
    }
  </style>
</head>
<body>
  <main>
    <header><h1 id="diagram-title">青野 · 功能模块图</h1><button type="button" onclick="window.print()">打印 / 保存 PDF</button></header>
    <figure aria-labelledby="diagram-title">
      <div class="canvas"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 610" role="img" aria-labelledby="tree-title tree-description">
  <title id="tree-title">青野功能模块图</title>
  <desc id="tree-description">青野分为学生、社团负责人、管理员、共用四个并列功能分组，每组向下连接所属功能。</desc>
  <defs><marker id="arrow" viewBox="0 0 6 6" refX="6" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#303d37"/></marker></defs>
  <g class="lines"><path d="M640 110 V166 M175 166 H1105"/></g>
  <rect class="root-box" x="410" y="26" width="460" height="84"/>
  <text class="root-name" x="640" y="62">青野</text>
  <text class="root-description" x="640" y="89">校园社团活动与共享资源管理系统</text>
<g class="function-group" data-group="学生" aria-label="学生功能">
      <g class="lines"><path d="M175 166 V216" marker-end="url(#arrow)"/>
      <path d="M175 274 V313 M94 313 H256"/></g>
      <rect class="role-box" x="84" y="218" width="182" height="56"/>
      <text class="role-name" x="175" y="253">学生</text>
<g class="module" aria-label="活动浏览">
          <path class="lines" d="M94 313 V348" marker-end="url(#arrow)"/>
          <rect class="module-box" x="72" y="350" width="44" height="220"/>
          <text class="module-name"><tspan x="94" y="428">活</tspan><tspan x="94" y="454">动</tspan><tspan x="94" y="480">浏</tspan><tspan x="94" y="506">览</tspan></text>
        </g>
<g class="module" aria-label="报名候补">
          <path class="lines" d="M148 313 V348" marker-end="url(#arrow)"/>
          <rect class="module-box" x="126" y="350" width="44" height="220"/>
          <text class="module-name"><tspan x="148" y="428">报</tspan><tspan x="148" y="454">名</tspan><tspan x="148" y="480">候</tspan><tspan x="148" y="506">补</tspan></text>
        </g>
<g class="module" aria-label="社团参与">
          <path class="lines" d="M202 313 V348" marker-end="url(#arrow)"/>
          <rect class="module-box" x="180" y="350" width="44" height="220"/>
          <text class="module-name"><tspan x="202" y="428">社</tspan><tspan x="202" y="454">团</tspan><tspan x="202" y="480">参</tspan><tspan x="202" y="506">与</tspan></text>
        </g>
<g class="module" aria-label="活动推荐">
          <path class="lines" d="M256 313 V348" marker-end="url(#arrow)"/>
          <rect class="module-box" x="234" y="350" width="44" height="220"/>
          <text class="module-name"><tspan x="256" y="428">活</tspan><tspan x="256" y="454">动</tspan><tspan x="256" y="480">推</tspan><tspan x="256" y="506">荐</tspan></text>
        </g>
</g>
<g class="function-group" data-group="社团负责人" aria-label="社团负责人功能">
      <g class="lines"><path d="M485 166 V216" marker-end="url(#arrow)"/>
      <path d="M485 274 V313 M404 313 H566"/></g>
      <rect class="role-box" x="394" y="218" width="182" height="56"/>
      <text class="role-name" x="485" y="253">社团负责人</text>
<g class="module" aria-label="社团维护">
          <path class="lines" d="M404 313 V348" marker-end="url(#arrow)"/>
          <rect class="module-box" x="382" y="350" width="44" height="220"/>
          <text class="module-name"><tspan x="404" y="428">社</tspan><tspan x="404" y="454">团</tspan><tspan x="404" y="480">维</tspan><tspan x="404" y="506">护</tspan></text>
        </g>
<g class="module" aria-label="成员审核">
          <path class="lines" d="M458 313 V348" marker-end="url(#arrow)"/>
          <rect class="module-box" x="436" y="350" width="44" height="220"/>
          <text class="module-name"><tspan x="458" y="428">成</tspan><tspan x="458" y="454">员</tspan><tspan x="458" y="480">审</tspan><tspan x="458" y="506">核</tspan></text>
        </g>
<g class="module" aria-label="活动组织">
          <path class="lines" d="M512 313 V348" marker-end="url(#arrow)"/>
          <rect class="module-box" x="490" y="350" width="44" height="220"/>
          <text class="module-name"><tspan x="512" y="428">活</tspan><tspan x="512" y="454">动</tspan><tspan x="512" y="480">组</tspan><tspan x="512" y="506">织</tspan></text>
        </g>
<g class="module" aria-label="器材申请">
          <path class="lines" d="M566 313 V348" marker-end="url(#arrow)"/>
          <rect class="module-box" x="544" y="350" width="44" height="220"/>
          <text class="module-name"><tspan x="566" y="428">器</tspan><tspan x="566" y="454">材</tspan><tspan x="566" y="480">申</tspan><tspan x="566" y="506">请</tspan></text>
        </g>
</g>
<g class="function-group" data-group="管理员" aria-label="管理员功能">
      <g class="lines"><path d="M795 166 V216" marker-end="url(#arrow)"/>
      <path d="M795 274 V313 M687 313 H903"/></g>
      <rect class="role-box" x="704" y="218" width="182" height="56"/>
      <text class="role-name" x="795" y="253">管理员</text>
<g class="module" aria-label="社团管理">
          <path class="lines" d="M687 313 V348" marker-end="url(#arrow)"/>
          <rect class="module-box" x="665" y="350" width="44" height="220"/>
          <text class="module-name"><tspan x="687" y="428">社</tspan><tspan x="687" y="454">团</tspan><tspan x="687" y="480">管</tspan><tspan x="687" y="506">理</tspan></text>
        </g>
<g class="module" aria-label="活动审核">
          <path class="lines" d="M741 313 V348" marker-end="url(#arrow)"/>
          <rect class="module-box" x="719" y="350" width="44" height="220"/>
          <text class="module-name"><tspan x="741" y="428">活</tspan><tspan x="741" y="454">动</tspan><tspan x="741" y="480">审</tspan><tspan x="741" y="506">核</tspan></text>
        </g>
<g class="module" aria-label="器材维护">
          <path class="lines" d="M795 313 V348" marker-end="url(#arrow)"/>
          <rect class="module-box" x="773" y="350" width="44" height="220"/>
          <text class="module-name"><tspan x="795" y="428">器</tspan><tspan x="795" y="454">材</tspan><tspan x="795" y="480">维</tspan><tspan x="795" y="506">护</tspan></text>
        </g>
<g class="module" aria-label="借还管理">
          <path class="lines" d="M849 313 V348" marker-end="url(#arrow)"/>
          <rect class="module-box" x="827" y="350" width="44" height="220"/>
          <text class="module-name"><tspan x="849" y="428">借</tspan><tspan x="849" y="454">还</tspan><tspan x="849" y="480">管</tspan><tspan x="849" y="506">理</tspan></text>
        </g>
<g class="module" aria-label="运行状态">
          <path class="lines" d="M903 313 V348" marker-end="url(#arrow)"/>
          <rect class="module-box" x="881" y="350" width="44" height="220"/>
          <text class="module-name"><tspan x="903" y="428">运</tspan><tspan x="903" y="454">行</tspan><tspan x="903" y="480">状</tspan><tspan x="903" y="506">态</tspan></text>
        </g>
</g>
<g class="function-group" data-group="共用" aria-label="共用功能">
      <g class="lines"><path d="M1105 166 V216" marker-end="url(#arrow)"/>
      <path d="M1105 274 V313 M997 313 H1213"/></g>
      <rect class="role-box" x="1014" y="218" width="182" height="56"/>
      <text class="role-name" x="1105" y="253">共用</text>
<g class="module" aria-label="登录与会话">
          <path class="lines" d="M997 313 V348" marker-end="url(#arrow)"/>
          <rect class="module-box" x="975" y="350" width="44" height="220"/>
          <text class="module-name"><tspan x="997" y="415">登</tspan><tspan x="997" y="441">录</tspan><tspan x="997" y="467">与</tspan><tspan x="997" y="493">会</tspan><tspan x="997" y="519">话</tspan></text>
        </g>
<g class="module" aria-label="个人资料">
          <path class="lines" d="M1051 313 V348" marker-end="url(#arrow)"/>
          <rect class="module-box" x="1029" y="350" width="44" height="220"/>
          <text class="module-name"><tspan x="1051" y="428">个</tspan><tspan x="1051" y="454">人</tspan><tspan x="1051" y="480">资</tspan><tspan x="1051" y="506">料</tspan></text>
        </g>
<g class="module" aria-label="个人记录">
          <path class="lines" d="M1105 313 V348" marker-end="url(#arrow)"/>
          <rect class="module-box" x="1083" y="350" width="44" height="220"/>
          <text class="module-name"><tspan x="1105" y="428">个</tspan><tspan x="1105" y="454">人</tspan><tspan x="1105" y="480">记</tspan><tspan x="1105" y="506">录</tspan></text>
        </g>
<g class="module" aria-label="消息管理">
          <path class="lines" d="M1159 313 V348" marker-end="url(#arrow)"/>
          <rect class="module-box" x="1137" y="350" width="44" height="220"/>
          <text class="module-name"><tspan x="1159" y="428">消</tspan><tspan x="1159" y="454">息</tspan><tspan x="1159" y="480">管</tspan><tspan x="1159" y="506">理</tspan></text>
        </g>
<g class="module" aria-label="校园助手">
          <path class="lines" d="M1213 313 V348" marker-end="url(#arrow)"/>
          <rect class="module-box" x="1191" y="350" width="44" height="220"/>
          <text class="module-name"><tspan x="1213" y="428">校</tspan><tspan x="1213" y="454">园</tspan><tspan x="1213" y="480">助</tspan><tspan x="1213" y="506">手</tspan></text>
        </g>
</g>
</svg></div>
      <figcaption>图 1　青野系统功能模块图</figcaption>
    </figure>
    <p class="note">学生、社团负责人、管理员均可使用“共用”功能。负责人身份属于具体社团，管理范围限于本社团。<br>连线表示功能归属；各项操作与技术设计见同目录《项目简介》。</p>
  </main>
</body>
</html>
