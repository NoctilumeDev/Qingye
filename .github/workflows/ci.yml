name: Qingye checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    name: Qingye · client and hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Review dependency changes against GitHub advisories
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          warn-only: false
          comment-summary-in-pr: never
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
      - run: python -B scripts/check.py hygiene
      - run: python -B scripts/check.py client

  h2:
    name: Qingye · H2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
      - run: python -B scripts/check.py h2
      - name: Fresh production bytecode analysis and retained-risk change gate
        run: python -B scripts/check.py static
      - name: Retain H2 test and coverage reports, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qingye-h2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/target/surefire-reports/TEST-*.xml
            backend/target/surefire-reports/*.txt
            backend/target/jacoco.exec
            backend/target/site/jacoco/
            backend/target/static-analysis/spotbugsXml.xml
          if-no-files-found: warn
          retention-days: 90

  mysql:
    name: Qingye · MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0.44
        env:
          MYSQL_ROOT_PASSWORD: qingye-ci-root-only
          MYSQL_DATABASE: qingye_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pqingye-ci-root-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
      - name: Provision schema-scoped test identity
        env:
          MYSQL_PWD: qingye-ci-root-only
        run: |
          mysql --protocol=TCP -h 127.0.0.1 -u root <<'SQL'
          CREATE USER 'qingye_ci_app'@'%' IDENTIFIED BY 'qingye-ci-app-only';
          GRANT SELECT,INSERT,UPDATE,DELETE,CREATE,ALTER,INDEX,REFERENCES ON qingye_test.* TO 'qingye_ci_app'@'%';
          SQL
      - name: Real MySQL tests
        env:
          QINGYE_TEST_URL: jdbc:mysql://127.0.0.1:3306/qingye_test?characterEncoding=utf8&serverTimezone=Asia/Shanghai
          QINGYE_TEST_USER: qingye_ci_app
          QINGYE_TEST_PASSWORD: qingye-ci-app-only
        run: python -B scripts/check.py mysql
      - name: Retain MySQL test and coverage reports, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qingye-mysql-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/target/surefire-reports/TEST-*.xml
            backend/target/surefire-reports/*.txt
            backend/target/jacoco.exec
            backend/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 90
